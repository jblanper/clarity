<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #fafaf9; color: #1c1917; }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#fafaf9',
            accent: '#f59e0b',
            stone: {
              50: '#f5f5f4',
              100: '#e7e5e4',
              200: '#d6d3d1',
              300: '#a8a29e',
              400: '#a8a29e',
              500: '#78716c',
              600: '#57534e',
              700: '#44403c',
              800: '#292524',
              900: '#1c1917',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="p-8 max-w-md mx-auto min-h-screen bg-background">
  <header class="mb-16">
    <h1 class="text-xl font-light tracking-[0.2em] text-stone-800 uppercase">Tapestry</h1>
    <p class="mt-4 text-sm text-stone-500 font-light italic tracking-wide">"The rhythm of your days."</p>
  </header>

  <section class="mb-20">
    <div class="grid grid-cols-7 gap-y-12">
      <!-- February Row Sample -->
      <div class="col-span-full mb-2">
        <p class="text-[10px] uppercase tracking-[0.3em] text-stone-400">February</p>
      </div>
      
      <!-- Week 1: Wide spacing, light weights -->
      <div class="flex items-center justify-center font-light tracking-[0.4em] text-stone-300">01</div>
      <div class="flex items-center justify-center font-light tracking-[0.4em] text-stone-300">02</div>
      <div class="flex items-center justify-center font-light tracking-[0.4em] text-stone-300">03</div>
      <div class="flex items-center justify-center font-light tracking-[0.4em] text-stone-300">04</div>
      <div class="flex items-center justify-center font-light tracking-[0.4em] text-stone-300">05</div>
      <div class="flex items-center justify-center font-medium tracking-normal text-amber-500 relative">06
        <span class="absolute -top-1 -right-1 w-1 h-1 bg-amber-500 rounded-full animate-pulse"></span>
      </div>
      <div class="flex items-center justify-center font-light tracking-[0.4em] text-stone-300">07</div>

      <!-- Week 2: Tighter spacing, bold weights -->
      <div class="flex items-center justify-center font-semibold tracking-tighter text-stone-900">08</div>
      <div class="flex items-center justify-center font-semibold tracking-tighter text-stone-900">09</div>
      <div class="flex items-center justify-center font-semibold tracking-tighter text-stone-900 relative">10
        <span class="absolute -top-1 -right-1 w-1 h-1 bg-amber-500 rounded-full"></span>
      </div>
      <div class="flex items-center justify-center font-semibold tracking-tighter text-stone-900">11</div>
      <div class="flex items-center justify-center font-semibold tracking-tighter text-stone-900">12</div>
      <div class="flex items-center justify-center font-semibold tracking-tighter text-stone-900">13</div>
      <div class="flex items-center justify-center font-semibold tracking-tighter text-stone-900">14</div>

      <!-- Week 3: Mixed -->
      <div class="flex items-center justify-center font-light tracking-[0.4em] text-stone-300">15</div>
      <div class="flex items-center justify-center font-normal tracking-wide text-stone-600">16</div>
      <div class="flex items-center justify-center font-normal tracking-wide text-stone-600">17</div>
      <div class="flex items-center justify-center font-normal tracking-wide text-stone-600 relative">18
        <span class="absolute -top-1 -right-1 w-1 h-1 bg-amber-500 rounded-full"></span>
      </div>
      <div class="flex items-center justify-center font-light tracking-[0.4em] text-stone-300">19</div>
      <div class="flex items-center justify-center font-light tracking-[0.4em] text-stone-300">20</div>
      <div class="flex items-center justify-center font-light tracking-[0.4em] text-stone-300">21</div>
    </div>
  </section>

  <footer class="mt-20 flex flex-col items-center gap-8">
    <p class="text-[10px] text-stone-400 uppercase tracking-[0.3em]">Spring arrives in 12 days</p>
  </footer>
</body>
</html>
