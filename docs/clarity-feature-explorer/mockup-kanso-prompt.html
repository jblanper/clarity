<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #fafaf9; color: #1c1917; }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#fafaf9',
            stone: {
              50: '#f5f5f4',
              100: '#e7e5e4',
              200: '#d6d3d1',
              300: '#a8a29e',
              400: '#a8a29e',
              500: '#78716c',
              600: '#57534e',
              700: '#44403c',
              800: '#292524',
              900: '#1c1917',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="p-8 max-w-md mx-auto min-h-screen bg-background">
  <header class="mb-12">
    <h1 class="text-xl font-light tracking-widest text-stone-800">Monday</h1>
    <p class="text-sm text-stone-500">March 9, 2026</p>
  </header>

  <section class="mb-12">
    <h2 class="mb-4 text-xs font-medium uppercase tracking-widest text-stone-500">Reflection</h2>
    <div class="space-y-4">
      <p class="text-xs font-light italic tracking-wide text-stone-500 opacity-80">
        "What small spark of joy did you notice today?"
      </p>
      <textarea
        class="w-full resize-none rounded-2xl border border-stone-200 bg-stone-50 px-4 py-4 text-sm font-light text-stone-700 placeholder-stone-400 focus:border-stone-400 focus:outline-none"
        rows="6"
        placeholder="Start typing..."
      ></textarea>
    </div>
  </section>

  <button class="w-full rounded-2xl bg-stone-900 py-4 text-sm tracking-widest text-white transition-opacity active:opacity-70">
    Save
  </button>
</body>
</html>
