<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #fafaf9; color: #1c1917; }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#fafaf9',
            stone: {
              50: '#f5f5f4',
              100: '#e7e5e4',
              200: '#d6d3d1',
              300: '#a8a29e',
              400: '#a8a29e',
              500: '#78716c',
              600: '#57534e',
              700: '#44403c',
              800: '#292524',
              900: '#1c1917',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="p-8 max-w-md mx-auto min-h-screen bg-background flex flex-col justify-center">
  <header class="mb-16 text-center">
    <h1 class="text-xl font-light tracking-[0.2em] text-stone-800 uppercase">Migration</h1>
    <p class="mt-4 text-sm text-stone-500 font-light">A new week begins. What will you carry forward?</p>
  </header>

  <section class="mb-16 space-y-12">
    <div>
      <p class="text-xs text-stone-400 uppercase tracking-widest mb-4">Quiet habits</p>
      <div class="space-y-8">
        <div>
          <label class="block text-sm text-stone-300 font-light mb-2">Morning meditation</label>
          <input
            type="text"
            placeholder="Type 'Morning meditation' to keep"
            class="w-full bg-transparent border-b border-stone-200 py-2 text-sm font-light text-stone-700 placeholder-stone-200 focus:border-stone-400 focus:outline-none transition-colors"
          />
        </div>
        <div>
          <label class="block text-sm text-stone-300 font-light mb-2">Read 10 pages</label>
          <input
            type="text"
            placeholder="Type 'Read 10 pages' to keep"
            class="w-full bg-transparent border-b border-stone-200 py-2 text-sm font-light text-stone-700 placeholder-stone-200 focus:border-stone-400 focus:outline-none transition-colors"
          />
        </div>
      </div>
    </div>
  </section>

  <footer class="mt-auto space-y-4">
    <button class="w-full rounded-2xl bg-stone-900 py-4 text-sm tracking-widest text-white transition-opacity active:opacity-70">
      Complete Migration
    </button>
    <p class="text-[10px] text-center text-stone-400 uppercase tracking-widest leading-relaxed">
      Unmoved habits will be archived to preserve your history.
    </p>
  </footer>
</body>
</html>
